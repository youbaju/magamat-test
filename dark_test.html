<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار الوضع الداكن</title>
<style>
body{font-family:sans-serif;margin:20px;font-size:22px;background:#fff;color:#000}
.box{padding:16px;margin:12px 0;border:2px solid #000}
#cssbox{background:#fff;color:#000}
@media (prefers-color-scheme: dark){ #cssbox{background:#264050;color:#bdd7f0} }
</style></head><body>
<h2>اختبار الوضع الداكن</h2>
<div class="box">نتيجة matchMedia: <b id="r">...</b></div>
<div class="box" id="cssbox">هذا المربع يصير أزرق غامق إذا عملت أنماط الوضع الداكن، وإلا يبقى أبيض</div>
<div class="box" style="background:#ffffff;color:#000000">مربع أبيض ثابت: إن ظهر رمادياً أو داكناً فالمتصفح يغمّق الصفحة بنفسه</div>
<script>
document.getElementById('r').textContent = matchMedia('(prefers-color-scheme: dark)').matches ? 'DARK (داكن)' : 'LIGHT (فاتح)';
</script></body></html>
